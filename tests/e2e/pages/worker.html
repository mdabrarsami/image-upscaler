<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>worker harness</title>
  </head>
  <body>
    <!--
      Drives the library from inside a module Worker. Nothing in the core may
      touch `document`, so this page proves that claim rather than asserting it.
    -->
    <script>
      window.runInWorker = (options) =>
        new Promise((resolve, reject) => {
          const worker = new Worker('/tests/e2e/pages/worker-driver.js', { type: 'module' });
          const timer = setTimeout(() => {
            worker.terminate();
            reject(new Error('worker timed out'));
          }, 120000);
          worker.onmessage = (event) => {
            clearTimeout(timer);
            worker.terminate();
            resolve(event.data);
          };
          worker.onerror = (event) => {
            clearTimeout(timer);
            worker.terminate();
            reject(new Error(event.message || 'worker error'));
          };
          worker.postMessage(options);
        });
    </script>
  </body>
</html>
